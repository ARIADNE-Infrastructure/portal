# Settings for Ariadne Server Module

services:
  ariadne-server:
    build:
      context: .
      dockerfile: server/docker/server.dockerfile
    working_dir: /var/www/html
    volumes:
      - ./server/:/var/www/
    ports:
      - 8080:80

